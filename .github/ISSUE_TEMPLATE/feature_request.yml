name: 💡 Sugerir uma melhoria
description: Ideias de novos recursos ou integrações
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Como você imagina a solução?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
